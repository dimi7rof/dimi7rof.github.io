<section class="wrapper info box right contacts">
    <div class="inner text rise flex center column gap20">
        <h3>Contacts</h3>
        <div class="social">
            <i>
                <a class="fa-solid fa-envelope" [href]="'mailto:' + profile.email"></a>
            </i>
            <i>
                <a class="fa-brands fa-linkedin-in" [href]="profile.linkedinUrl" target="_blank"
                    rel="noopener noreferrer"></a>
            </i>
            <i>
                <a class="fa-brands fa-github" [href]="profile.githubUrl" target="_blank" rel="noopener noreferrer"></a>
            </i>
            <i>
                <a style="display: none;" class="fab fa-facebook-f" href="http://facebook.com/dimi7rof"
                    target="_blank"></a>
            </i>
        </div>
    </div>
</section>
