<section class="wrapper experience box right">
    <div class="inner text rise wide80 flex center column">
        <h3>Experience</h3>
        <ol>
            @for (job of experience; track job.title + job.company) {
            <li>{{ job.title }}</li>
            <ol>
                <li class="company">
                    {{ job.company }}: {{ job.current ? currentPossitionTime : job.duration }}
                </li>
            </ol>
            }
        </ol>
    </div>
</section>
